<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic-Tac-Toe Learning AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700&family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <span></span><span></span><span></span>
        </div>
        <span>Tic-Tac-Toe</span>
      </div>
      <button class="icon-button" id="resetGame" type="button" title="Restart game" aria-label="Restart game">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20 11a8.1 8.1 0 1 1-2.35-5.65M20 4v7h-7"/>
        </svg>
      </button>
    </header>

    <section class="game-layout">
      <aside class="sidebar">
        <div>
          <p class="eyebrow">Match mode</p>
          <h1>Play against<br>the <span>Learning AI</span></h1>
        </div>

        <div class="difficulty">
          <span class="difficulty-label">Difficulty</span>
          <div class="segmented-control" role="radiogroup" aria-label="Difficulty">
            <button type="button" role="radio" aria-checked="true" data-level="easy">Easy</button>
            <button type="button" role="radio" aria-checked="false" data-level="medium">Medium</button>
            <button type="button" role="radio" aria-checked="false" data-level="hard">Hard</button>
          </div>
        </div>

        <div class="score-card">
          <div class="score-item">
            <span class="score-mark x-mark">X</span>
            <span>You</span>
            <strong id="playerScore">0</strong>
          </div>
          <div class="score-item">
            <span class="score-mark o-mark">O</span>
            <span>AI</span>
            <strong id="aiScore">0</strong>
          </div>
          <div class="score-item">
            <span class="score-mark draw-mark">—</span>
            <span>Draw</span>
            <strong id="drawScore">0</strong>
          </div>
        </div>
      </aside>

      <section class="game-area" aria-label="Tic-tac-toe game">
        <div class="turn-banner" id="turnBanner">
          <span class="turn-dot">X</span>
          <div>
            <strong id="turnTitle">Your turn</strong>
            <span id="turnSubtitle">Choose a square</span>
          </div>
        </div>

        <div class="board" id="board" role="grid" aria-label="Tic-tac-toe board">
          <button class="cell" type="button" data-index="0" role="gridcell" aria-label="Top left"></button>
          <button class="cell" type="button" data-index="1" role="gridcell" aria-label="Top center"></button>
          <button class="cell" type="button" data-index="2" role="gridcell" aria-label="Top right"></button>
          <button class="cell" type="button" data-index="3" role="gridcell" aria-label="Middle left"></button>
          <button class="cell" type="button" data-index="4" role="gridcell" aria-label="Middle center"></button>
          <button class="cell" type="button" data-index="5" role="gridcell" aria-label="Middle right"></button>
          <button class="cell" type="button" data-index="6" role="gridcell" aria-label="Bottom left"></button>
          <button class="cell" type="button" data-index="7" role="gridcell" aria-label="Bottom center"></button>
          <button class="cell" type="button" data-index="8" role="gridcell" aria-label="Bottom right"></button>
        </div>

        <button class="new-game-button" id="newGame" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 11a8.1 8.1 0 1 1-2.35-5.65M20 4v7h-7"/>
          </svg>
          New game
        </button>
      </section>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
